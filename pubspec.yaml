name: medibook
description: "Medibook — mobile patient app for booking doctor appointments, lab tests and health records."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

# NOTE ON VERSIONS
# The scaffold shipped with a newer Dart SDK (^3.12.2); per the maintainer's
# decision we keep that SDK and resolve UI packages at their latest compatible
# versions rather than pinning to Technical_stack.md's Flutter 3.24.5 set.
# The data layer uses dio (no retrofit/freezed codegen), hive with AES
# encryption (no isar) and razorpay_flutter; each addition beyond
# Technical_stack.md is commented where it is declared (CL CODE-017).
dependencies:
  flutter:
    sdk: flutter

  # Framework localization delegates (Material/Cupertino/Widgets). Required for
  # the l10n scaffolding in app/localization/l10n.dart — without it the
  # framework itself stays English-only no matter what our strings do.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (presentation-local providers + UI controllers)
  flutter_riverpod: ^2.6.1

  # Responsive sizing — Figma base 390x844 (see app/config/constants.dart)
  flutter_screenutil: ^5.9.3

  # Vector icons (exact Iconsax path data exported from the design system)
  flutter_svg: ^2.0.16

  # Remote/asset image handling (doctor & clinic photography)
  cached_network_image: ^3.4.1

  # Declarative routing + bottom-nav shell
  go_router: ^14.6.2

  # NOTE: carousel_slider and shimmer (from Technical_stack.md) are intentionally
  # omitted for now — the promo banner uses a plain PageView, and there are no
  # async loads to skeleton yet. Re-add them with the data/loading layer.

  # Date/number formatting
  intl: ^0.20.2

  # SHA-256 for the Hive cache-key strategy (docs-flutter/HIVE implementation.md).
  # Already in the lockfile transitively (flutter_cache_manager); promoted to a
  # direct dependency because core/storage/hive/keys.dart imports it.
  crypto: ^3.0.7
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1
  razorpay_flutter: ^1.4.7
  url_launcher: ^6.3.2
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0

  # Crash reporting backend, behind app/monitoring/crash_reporting.dart.
  sentry_flutter: ^9.30.1

  # Google Play in-app updates (features/app_update). package_info_plus reads
  # the installed version to compare with the backend's min_versions.
  in_app_update: ^5.0.0
  package_info_plus: ^10.2.2

  # Device location for "Hospitals Near You" (owner decision 6 Oct 2026,
  # CL DISC-015): one coarse fix is sent as lat/lng and the backend sorts by
  # distance. Not in Technical_stack.md — an approved addition.
  geolocator: ^14.0.1
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

  # NOTE: flutter_launcher_icons and flutter_native_splash are NOT installed.
  # The Android mipmap set, the adaptive icon, the iOS AppIcon.appiconset and
  # the launch images in this repo were generated directly from the brand mark
  # and are committed, so no build step is required. The `flutter_launcher_icons`
  # and `flutter_native_splash` blocks below are kept fully configured so that
  # regenerating them is a two-command job when the brand mark changes:
  #
  #   dart pub add --dev flutter_launcher_icons flutter_native_splash
  #   dart run flutter_launcher_icons && dart run flutter_native_splash:create
  #
  # Add them as dev dependencies only when you actually need to regenerate;
  # leaving them out keeps the dependency surface of this build minimal.

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    # Font licences (SIL OFL 1.1), shown on Profile > Open-source licences.
    - assets/licenses/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf

# ============================================================================
# LAUNCHER ICON CONFIG (flutter_launcher_icons)
# ----------------------------------------------------------------------------
# Source of truth for regenerating the icon sets. The committed rasters already
# match this configuration; see the note in dev_dependencies above.
# ============================================================================
flutter_launcher_icons:
  image_path: "assets/images/brand_mark.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21

  # Adaptive icon (API 26+): brand-navy plate, white glyph foreground.
  adaptive_icon_background: "#1D3557"
  adaptive_icon_foreground: "assets/images/brand_mark_foreground.png"
  adaptive_icon_monochrome: "assets/images/brand_mark_foreground.png"

  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# ============================================================================
# NATIVE SPLASH CONFIG (flutter_native_splash)
# ----------------------------------------------------------------------------
# Matches the hand-written launch_background.xml / LaunchScreen.storyboard
# treatment already committed, so regenerating produces the same result rather
# than overwriting it with something different.
# ============================================================================
flutter_native_splash:
  # AppColors.surface — the app's own first frame is this colour, so there is no
  # flash between the splash and the UI.
  color: "#FFFFFF"
  image: "assets/images/brand_mark.png"

  # A device in dark mode would otherwise flash white; brand navy is the right
  # neutral there. Medibook itself has no dark theme.
  color_dark: "#1D3557"
  image_dark: "assets/images/brand_mark_foreground.png"

  android: true
  ios: true
  web: false

  android_12:
    # Android 12+ uses the SplashScreen API; the icon is masked to a circle, so
    # the padded foreground is used rather than the full plate.
    image: "assets/images/brand_mark_foreground.png"
    color: "#FFFFFF"
    image_dark: "assets/images/brand_mark_foreground.png"
    color_dark: "#1D3557"
