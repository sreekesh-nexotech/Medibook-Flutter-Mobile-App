name: medibook
description: "Medibook — mobile patient app for booking doctor appointments, lab tests and health records."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# NOTE ON VERSIONS
# The scaffold shipped with a newer Dart SDK (^3.12.2); per the maintainer's
# decision we keep that SDK and resolve UI packages at their latest compatible
# versions rather than pinning to Technical_stack.md's Flutter 3.24.5 set.
# This session builds the PRESENTATION layer only — networking (dio/retrofit),
# persistence (hive/isar), payments (razorpay) and codegen (freezed) are
# intentionally absent until the data/domain layers are built.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (presentation-local providers + UI controllers)
  flutter_riverpod: ^2.6.1

  # Responsive sizing — Figma base 390x844 (see app/config/constants.dart)
  flutter_screenutil: ^5.9.3

  # Vector icons (exact Iconsax path data exported from the design system)
  flutter_svg: ^2.0.16

  # Remote/asset image handling (doctor & clinic photography)
  cached_network_image: ^3.4.1

  # Home promo banner carousel
  carousel_slider: ^5.0.0

  # Skeleton loaders (cache/loading states, ready for the API session)
  shimmer: ^3.0.0

  # Declarative routing + bottom-nav shell
  go_router: ^14.6.2

  # Date/number formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
